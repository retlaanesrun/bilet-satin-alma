services:
  php:
    build: .
    volumes:
      - .:/var/www/html
      - appdata:/var/www/html/data   
    expose:
      - "9000"
  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php

volumes:
  appdata:    
